common:
  msg_source: 1
  send_packet_ros: false
  send_point_cloud_ros: true
lidar:
  - driver:
      lidar_type: RSHELIOS
      msop_port: 6699
      difop_port: 7788
      imu_port: 0
      min_distance: 0.2
      # Helios-32 manual: supported measurement range ends at 150 m.
      max_distance: 150.0
      # Vehicle IPC system clock is the only ROS header timestamp source.
      use_lidar_clock: false
      dense_points: false
      ts_first_point: true
      # The vehicle setup is fixed at 600 rpm (10 Hz); keep single-return mode
      # in the lidar Web UI for the first LIO-SAM calibration runs.
      start_angle: 0
      end_angle: 360
    ros:
      ros_frame_id: velodyne
      ros_recv_packet_topic: /rslidar_packets
      ros_send_packet_topic: /rslidar_packets
      ros_send_imu_data_topic: /rslidar_imu_unused
      ros_send_point_cloud_topic: /rslidar_points
      ros_queue_length: 100
